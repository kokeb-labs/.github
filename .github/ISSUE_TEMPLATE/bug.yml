name: Bug report
description: Something builds wrong, behaves wrong or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through a private security advisory, not an issue. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including error messages or log output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, configuration and the smallest code that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit of this repository (and of kb-core, if you use it).
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - ESP32 family
        - STM32 family
        - Other MCU
        - Host (tests or simulation)
    validations:
      required: true
  - type: dropdown
    id: rtos
    attributes:
      label: RTOS
      options:
        - FreeRTOS
        - ThreadX
        - None (bare metal or host)
        - Other
  - type: input
    id: toolchain
    attributes:
      label: Toolchain
      description: SDK version, compiler, host OS.
      placeholder: ESP-IDF v5.5, GCC 14, macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Serial output, CI log excerpt or backtrace.
      render: text
