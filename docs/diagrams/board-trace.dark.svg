<text x="245.5" y="115.5" font-size="15" font-weight="700" fill="#E8EDF3">Need</text>
<text x="245.5" y="140.4" font-size="13" fill="#D2DAE4">what a user or</text>
<text x="245.5" y="159.2" font-size="13" fill="#D2DAE4">integrator wants</text>
<text x="245.5" y="249.6" font-size="15" font-weight="700" fill="#E8EDF3">Requirements</text>
<text x="245.5" y="274.4" font-size="13" fill="#D2DAE4">testable, versioned</text>
<text x="201.5" y="364.6" font-size="15" font-weight="700" fill="#E8EDF3">Hardware, firmware, enclosure</text>
<text x="201.5" y="389.4" font-size="13" fill="#D2DAE4">KiCad and reviewed parts</text>
<text x="201.5" y="408.3" font-size="13" fill="#D2DAE4">the chip drivers</text>
<text x="201.5" y="427.1" font-size="13" fill="#D2DAE4">the mechanical design</text>
<text x="245.5" y="517.5" font-size="15" font-weight="700" fill="#E8EDF3">Verification</text>
<text x="245.5" y="542.4" font-size="13" fill="#D2DAE4">procedures, results,</text>
<text x="245.5" y="561.2" font-size="13" fill="#D2DAE4">evidence</text>
<text x="245.5" y="651.5" font-size="15" font-weight="700" fill="#E8EDF3">Release</text>
<text x="245.5" y="676.4" font-size="13" fill="#D2DAE4">signed tag, evidence</text>
<text x="245.5" y="695.2" font-size="13" fill="#D2DAE4">pack</text>
<text x="245.5" y="714.1" font-size="13" fill="#D2DAE4">manufacturing package</text>
